services:
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: agent-container-dashboard:dev
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-3780}:3780"
    environment:
      T3_PUBLIC_URL: "${T3_PUBLIC_URL:-http://localhost:3773}"
      DASHBOARD_PUBLIC_URL: "${DASHBOARD_PUBLIC_URL:-}"
    volumes:
      - agent-home:/home/agent
      - agent-workspace:/workspace
      - dashboard-state:/var/lib/agent-dashboard
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      workspace:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3780/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
  workspace:
    hostname: "${WORKSPACE_HOSTNAME:-agent-container}"
    build:
      context: .
      args:
        T3_REFRESH: "${T3_REFRESH:-latest}"
    image: agent-container:dev
    init: true
    stop_grace_period: 45s
    restart: unless-stopped
    ports:
      - "${T3_BIND_ADDRESS:-127.0.0.1}:${T3_PORT:-3773}:3773"
    environment:
      T3_PUBLIC_URL: "${T3_PUBLIC_URL:-http://localhost:3773}"
    volumes:
      - agent-home:/home/agent
      - agent-workspace:/workspace
    healthcheck:
      test: ["CMD", "workspace-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  dashboard-state:
  agent-home:
  agent-workspace:
