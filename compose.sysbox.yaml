services:
  workspace:
    runtime: sysbox-runc
    # The launcher starts dockerd, then drops the application to the agent user.
    user: "0:0"
    environment:
      WORKSPACE_DOCKER_ENABLED: "true"
    volumes:
      - agent-docker:/var/lib/docker
    stop_grace_period: 45s
    healthcheck:
      timeout: 10s
      start_period: 120s

volumes:
  agent-docker:
