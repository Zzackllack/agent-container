name: Container images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/images.yaml
      - .dockerignore
      - Dockerfile
      - dashboard/**
      - scripts/**
      - tests/**
      - versions/**
      - config/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/images.yaml
      - .dockerignore
      - Dockerfile
      - dashboard/**
      - scripts/**
      - tests/**
      - versions/**
      - config/**
  workflow_dispatch:
  schedule:
    # Refresh the floating T3 nightly seed; existing homes retain their runtime.
    - cron: '15 4 * * *'

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.image }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        image: [agent-container, agent-container-dashboard]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: agent-container
            dockerfile: Dockerfile
          - image: agent-container-dashboard
            dockerfile: dashboard/Dockerfile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ matrix.image }}:test
          build-args: T3_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Verify workspace tools and lifecycle
        if: matrix.image == 'agent-container'
        run: |
          docker run --rm --init agent-container:test sh -ec \
            'sudo -n true; command -v apt-get; codex --version; opencode --version; t3 --version; gh --version; docker --version; docker compose version; docker buildx version; sudo dockerd --validate'
          for test in workspace-entrypoint agent-cli sync-instructions; do
            docker run --rm --init --user 0:0 \
              --mount "type=bind,source=$PWD,target=/tests,readonly" \
              agent-container:test bash "/tests/tests/$test.sh"
          done
          docker run --rm --init \
            --mount "type=bind,source=$PWD,target=/tests,readonly" \
            agent-container:test bash /tests/tests/context7-setup.sh
      - name: Verify dashboard persistence
        if: matrix.image == 'agent-container-dashboard'
        # This host-side test uses only Python's standard library and Docker.
        run: python3 tests/dashboard.py agent-container-dashboard:test
      - name: Sign in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested architecture
        if: github.event_name != 'pull_request'
        env:
          IMAGE_NAME: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME"
          tag="build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          docker tag "$IMAGE_NAME:test" "$image:$tag"
          docker push "$image:$tag"

  publish:
    name: Publish ${{ matrix.image }} manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        image: [agent-container, agent-container-dashboard]
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform tags
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME"
          tag="build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx imagetools create \
            --tag "$image:$tag" --tag "$image:latest" \
            "$image:$tag-amd64" "$image:$tag-arm64"
          docker buildx imagetools inspect "$image:$tag"
