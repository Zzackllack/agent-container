name: openhands-review

services:
  backend:
    image: ${OPENHANDS_IMAGE:-${WORKSPACE_IMAGE:-ghcr.io/zzackllack/agent-container:latest}}
    command: ["agent-canvas", "--backend-only", "--public", "--host", "0.0.0.0"]
    runtime: sysbox-runc
    # The workspace entrypoint starts the inner daemon, then runs Canvas as agent.
    user: "0:0"
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      WORKSPACE_DOCKER_ENABLED: "true"
      LOCAL_BACKEND_API_KEY: ${OPENHANDS_BACKEND_API_KEY:?Set OPENHANDS_BACKEND_API_KEY}
      OH_CONVERSATION_RUNTIME: local
      AUTOMATION_WORKSPACE_BASE: /workspace/automations
      OH_ALLOW_CORS_ORIGINS_0: ${OPENHANDS_FRONTEND_ORIGIN:-http://127.0.0.1:8100}
      AUTOMATION_CORS_ORIGINS: ${OPENHANDS_FRONTEND_ORIGIN:-http://127.0.0.1:8100}
      GH_CONFIG_DIR: /home/agent/.config/gh
      GH_TOKEN: ${OPENHANDS_GH_TOKEN:-}
    ports:
      - "${OPENHANDS_BACKEND_BIND_IP:-127.0.0.1}:${OPENHANDS_BACKEND_PORT:-8101}:8000"
    volumes:
      - review-home:/home/agent
      - review-workspace:/workspace
      - review-docker:/var/lib/docker
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:8000/ready >/dev/null &&
          curl -fsS http://127.0.0.1:8000/api/automation/health >/dev/null
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

volumes:
  review-home:
  review-workspace:
  review-docker:
